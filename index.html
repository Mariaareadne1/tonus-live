<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tonus live</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>tonus <em>live</em></h1>
    <p class="subtitle">milestone 2 · sound picker + effects</p>

    <div class="row">
      <button id="play">play loop</button>
      <button id="stop">stop</button>
    </div>

    <label class="control">
      <span class="control-label">sound</span>
      <select id="sound"></select>
    </label>

    <div id="effects" class="panel"></div>

    <pre id="log"></pre>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
