<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tonus live</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>tonus <em>live</em></h1>
    <p class="subtitle">milestone 8 · export</p>

    <div class="row">
      <button id="play">play loop</button>
      <button id="stop">stop</button>
    </div>

    <p class="hint">
      play notes on your computer keyboard ·
      lower octave <kbd>z s x d c v g b h n j m</kbd> ·
      upper octave <kbd>q 2 w 3 e r 5 t 6 y 7 u</kbd>
    </p>

    <label class="control">
      <span class="control-label">sound</span>
      <select id="sound"></select>
    </label>

    <div id="chords" class="panel"></div>

    <div id="arp" class="panel"></div>

    <div id="drums" class="panel"></div>

    <div id="record" class="panel"></div>

    <div id="layers" class="panel"></div>

    <div id="effects" class="panel"></div>

    <div id="export" class="panel"></div>

    <pre id="log"></pre>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
